<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beacon - GenAI Recovery & Intervention</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Bright & Vivid Modern Container */
        .ai-voice-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 420px;
            height: 680px;
            /* Radiant Bright Cyan/Teal Gradient */
            background: radial-gradient(circle at 50% 30%, #e0f7fc 0%, #b3ecff 50%, #eefbfd 100%);
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 180, 216, 0.2), inset 0 0 35px rgba(255, 255, 255, 0.8);
            position: relative;
            overflow: hidden;
            padding: 30px 20px;
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        .ai-voice-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 32px;
            box-shadow: inset 0 0 30px rgba(0, 150, 255, 0.15);
            pointer-events: none;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0077b6;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .orb-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }

        /* High-contrast crisp typography */
        .transcript-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: center;
        }

        .box-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            padding: 12px 16px;
            text-align: left;
        }

        .box-title {
            font-size: 0.75rem;
            font-weight: 800;
            color: #0077b6;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .box-content {
            font-size: 0.95rem;
            color: #032b43;
            font-weight: 600;
            line-height: 1.4;
        }

        /* Recording Controls */
        .controls {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
            margin-top: 10px;
        }

        .btn-record {
            background: linear-gradient(135deg, #00b4d8 0%, #0077b6 100%);
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 180, 216, 0.35);
            transition: all 0.2s ease;
        }

        .btn-record:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0, 180, 216, 0.45);
        }

        .btn-record.recording {
            background: linear-gradient(135deg, #e63946 0%, #d62828 100%);
            box-shadow: 0 8px 20px rgba(230, 57, 70, 0.4);
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="ai-voice-container">
    <div class="header-title">Beacon Intervention</div>

    <!-- Animated Audio Orb -->
    <div class="orb-wrapper">
        <canvas id="voiceOrbCanvas" width="280" height="280"></canvas>
    </div>

    <!-- Live Transcript & Action Steps -->
    <div class="transcript-section">
        <div class="box-card">
            <div class="box-title">What We Heard (You Said)</div>
            <div class="box-content" id="userSpeechText">Press Record and speak...</div>
        </div>

        <div class="box-card">
            <div class="box-title">Spoken Intervention</div>
            <div class="box-content" id="aiScriptText">Awaiting input...</div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button id="recordBtn" class="btn-record">Start Recording</button>
    </div>
</div>

<script>
    // Canvas & Orb Visualizer Setup
    const canvas = document.getElementById('voiceOrbCanvas');
    const ctx = canvas.getContext('2d');
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const baseRadius = 70;

    let audioContext, analyser, dataArray;
    let animationFrameId;
    let rotationAngle = 0;

    function drawVoiceOrb() {
        animationFrameId = requestAnimationFrame(drawVoiceOrb);

        if (analyser) {
            analyser.getByteFrequencyData(dataArray);
        }

        let sum = 0;
        if (dataArray) {
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
        }
        let audioIntensity = dataArray ? (sum / dataArray.length) / 255 : 0.05;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        rotationAngle += 0.015;
        const numRings = 12;

        ctx.lineWidth = 1.8;

        for (let i = 0; i < numRings; i++) {
            ctx.beginPath();

            const ringGradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            ringGradient.addColorStop(0, `rgba(0, 119, 182, ${0.7 + audioIntensity * 0.3})`);
            ringGradient.addColorStop(0.5, `rgba(0, 180, 216, ${0.8 + audioIntensity * 0.2})`);
            ringGradient.addColorStop(1, `rgba(114, 9, 183, ${0.5 + audioIntensity * 0.5})`);
            ctx.strokeStyle = ringGradient;

            const ringAngle = rotationAngle + (i * Math.PI / numRings);
            const dynamicRadiusX = baseRadius + (audioIntensity * 30 * Math.sin(ringAngle * 2));
            const dynamicRadiusY = baseRadius * Math.abs(Math.cos(ringAngle)) + (audioIntensity * 15);

            ctx.ellipse(
                centerX, 
                centerY, 
                Math.max(10, dynamicRadiusX), 
                Math.max(5, dynamicRadiusY), 
                ringAngle, 
                0, 
                2 * Math.PI
            );
            ctx.stroke();
        }
    }

    // Start Idle Animation
    drawVoiceOrb();

    function playAudioWithAnimation(base64AudioData) {
        const audio = new Audio(base64AudioData);

        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        const source = audioContext.createMediaElementSource(audio);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 128;

        source.connect(analyser);
        analyser.connect(audioContext.destination);

        dataArray = new Uint8Array(analyser.frequencyBinCount);

        audio.play();

        audio.onended = () => {
            dataArray = null; // Return to idle state
        };
    }

    // Recording Logic
    let mediaRecorder;
    let audioChunks = [];
    const recordBtn = document.getElementById('recordBtn');
    const userSpeechText = document.getElementById('userSpeechText');
    const aiScriptText = document.getElementById('aiScriptText');

    recordBtn.addEventListener('click', async () => {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
            recordBtn.innerText = "Processing...";
            recordBtn.classList.remove('recording');
        } else {
            audioChunks = [];
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.start();

                recordBtn.innerText = "Stop Recording";
                recordBtn.classList.add('recording');

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await sendAudioToBackend(audioBlob);
                    recordBtn.innerText = "Start Recording";
                };
            } catch (err) {
                alert("Microphone access is required to use this feature.");
                recordBtn.innerText = "Start Recording";
            }
        }
    });

    async function sendAudioToBackend(audioBlob) {
        const formData = new FormData();
        formData.append("file", audioBlob, "recording.webm");

        try {
            // Note: Include Bearer auth token header if authentication is enabled
            const response = await fetch('/api/voice-intervention', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (result.status === 'success') {
                userSpeechText.innerText = result.transcription || "No transcription available.";
                aiScriptText.innerText = result.deescalation_script;

                if (result.audio_base64) {
                    const audioSrc = `data:${result.audio_mime};base64,${result.audio_base64}`;
                    playAudioWithAnimation(audioSrc);
                }
            } else {
                aiScriptText.innerText = "Error: " + (result.detail || "Unable to process audio.");
            }
        } catch (error) {
            aiScriptText.innerText = "Connection error. Please try again.";
        }
    }
</script>
</body>
</html>
