<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beacon - GenAI Recovery & Intervention</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
        }

        .card-header {
            font-size: 0.8rem;
            font-weight: 700;
            color: #58a6ff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .card-body {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #f0f6fc;
        }

        .controls {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2ea043;
        }

        button.recording {
            background-color: #da3633;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="card-header">WHAT WE HEARD</div>
        <div class="card-body" id="whatWeHeardText">Press record and speak your message...</div>
    </div>

    <div class="card">
        <div class="card-header">SPOKEN RESPONSE</div>
        <div class="card-body" id="spokenResponseText">Awaiting input...</div>
    </div>

    <div class="card">
        <div class="card-header">RIGHT NOW</div>
        <div class="card-body" id="rightNowText">Awaiting analysis...</div>
    </div>

    <div class="controls">
        <button id="recordBtn">Start Recording</button>
    </div>
</div>

<script>
    let mediaRecorder;
    let audioChunks = [];
    const recordBtn = document.getElementById('recordBtn');
    const whatWeHeardText = document.getElementById('whatWeHeardText');
    const spokenResponseText = document.getElementById('spokenResponseText');
    const rightNowText = document.getElementById('rightNowText');

    recordBtn.addEventListener('click', async () => {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
            recordBtn.innerText = "Processing...";
            recordBtn.classList.remove('recording');
        } else {
            audioChunks = [];
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.start();

                recordBtn.innerText = "Stop Recording";
                recordBtn.classList.add('recording');

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await sendAudioToBackend(audioBlob);
                    recordBtn.innerText = "Start Recording";
                };
            } catch (err) {
                alert("Microphone access is required.");
                recordBtn.innerText = "Start Recording";
            }
        }
    });

    async function sendAudioToBackend(audioBlob) {
        const formData = new FormData();
        formData.append("file", audioBlob, "recording.webm");

        const token = localStorage.getItem('token');

        try {
            const response = await fetch('/api/voice-intervention', {
                method: 'POST',
                headers: token ? { 'Authorization': `Bearer ${token}` } : {},
                body: formData
            });

            const result = await response.json();

            if (result.status === 'success') {
                whatWeHeardText.innerText = result.transcription || "Transcription generated.";
                spokenResponseText.innerText = result.deescalation_script;
                
                try {
                    const parsed = JSON.parse(result.data);
                    if (parsed.immediate_safety_steps) {
                        rightNowText.innerText = parsed.immediate_safety_steps.join(', ');
                    }
                } catch(e) {
                    rightNowText.innerText = result.deescalation_script;
                }

                if (result.audio_base64) {
                    const audio = new Audio(`data:${result.audio_mime};base64,${result.audio_base64}`);
                    audio.play();
                }
            } else {
                spokenResponseText.innerText = "Error: " + (result.detail || "Unable to process audio.");
            }
        } catch (error) {
            spokenResponseText.innerText = "Connection error. Please try again.";
        }
    }
</script>
</body>
</html>
