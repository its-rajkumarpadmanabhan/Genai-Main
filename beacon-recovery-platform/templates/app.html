<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEACON — Emergency Voice Intervention Engine</title>

<!-- Auth Guard: runs before anything renders. No valid session -> straight to login. -->
<script>
  (function () {
    const token = localStorage.getItem('beacon_token');
    if (!token) {
      window.location.replace('/login.html');
    }
  })();
</script>
<style>
  body { visibility: hidden; }
  body.beacon-authed { visibility: visible; }
</style>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root{
    --bg-0:#04060d;
    --bg-1:#070b18;
    --blue-glow:#2f6bff;
    --blue-bright:#5b8fff;
    --blue-soft:#1c3a8a;
    --ink-hi:#f2f5ff;
    --ink-mid:#aab3cf;
    --ink-low:#66708f;
    --line:rgba(255,255,255,0.08);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    background:var(--bg-0);
    color:var(--ink-hi);
    font-family:'Segoe UI', ui-sans-serif, system-ui, -apple-system, sans-serif;
    overflow-x:hidden;
    min-height: 100vh;
  }

  /* Ambient background glow layers */
  .bg-glow{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse 900px 500px at 50% 30%, rgba(47,107,255,0.35), transparent 60%),
      radial-gradient(ellipse 700px 700px at 50% 78%, rgba(47,107,255,0.22), transparent 65%),
      var(--bg-0);
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:1100px;
    margin:0 auto;
    padding:0 32px;
  }

  /* NAV */
  nav{
    display:flex;
    align-items:center;
    justify-space-between;
    padding:26px 32px;
    max-width:1100px;
    margin:0 auto;
    position:relative;
    z-index:5;
  }

  .logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:600;
    font-size:16px;
    letter-spacing:0.2px;
  }

  .logo .mark{
    width:28px;
    height:28px;
    border-radius:8px;
    background:linear-gradient(135deg, var(--blue-bright), var(--blue-soft));
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    box-shadow:0 0 18px rgba(91,143,255,0.55);
  }

  /* HERO */
  .hero{
    text-align:center;
    padding:20px 20px 10px;
    position:relative;
    z-index:2;
  }

  .hero h1{
    font-size:36px;
    line-height:1.25;
    font-weight:600;
    color:var(--ink-mid);
    letter-spacing:-0.3px;
  }
  .hero h1 b, .hero h1 strong{
    color:var(--ink-hi);
    font-weight:700;
  }

  .orb-stage{
    position:relative;
    width:100%;
    max-width:320px;
    aspect-ratio:1/1;
    margin:30px auto 20px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  #orbCanvas{
    width:100%;
    height:100%;
    display:block;
    cursor:pointer;
  }

  .orb-halo{
    position:absolute;
    inset:-40px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(60,110,255,0.35), transparent 70%);
    filter:blur(18px);
    z-index:-1;
    animation:halo-pulse 4.5s ease-in-out infinite;
  }

  @keyframes halo-pulse{
    0%,100%{ transform:scale(1); opacity:0.7; }
    50%{ transform:scale(1.08); opacity:1; }
  }

  .mic-center{
    position:absolute;
    width:42px;
    height:42px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffffff, #cfd8ff 60%, #97a8ff);
    box-shadow:0 0 20px 6px rgba(255,255,255,0.55), 0 0 40px 14px rgba(91,143,255,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    transition:transform .25s ease, background .25s ease;
  }
  .orb-stage.listening .mic-center{ transform:scale(1.2); }

  .speak-btn{
    display:inline-flex;
    align-items:center;
    gap:9px;
    margin:0 auto;
    padding:12px 28px;
    border-radius:999px;
    border:1px solid rgba(120,150,255,0.4);
    background:linear-gradient(180deg, rgba(60,100,240,0.35), rgba(30,50,140,0.35));
    color:#dbe4ff;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 0 24px rgba(60,100,240,0.35), inset 0 1px 0 rgba(255,255,255,0.15);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .speak-btn:hover{ transform:translateY(-1px); box-shadow:0 0 34px rgba(60,100,240,0.55); }
  .speak-btn .dot{
    width:8px;height:8px;border-radius:50%;
    background:#7ee0ff;
    box-shadow:0 0 8px #7ee0ff;
  }
  .orb-stage.listening ~ .speak-wrap .speak-btn .dot{ animation:blink 1s ease-in-out infinite; background:#ff4d4d; box-shadow:0 0 8px #ff4d4d; }

  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  .speak-wrap{ text-align:center; margin-bottom:40px; }
  .status-label{
    display:block;
    margin-top:14px;
    font-size:13px;
    color:var(--ink-mid);
    letter-spacing:0.3px;
  }

  @media (max-width:640px){
    .hero h1{ font-size:26px; }
    nav{ padding:20px; }
  }
</style>
</head>
<body>

<div class="bg-glow"></div>

<nav>
  <div class="logo">
    <span class="mark"><i class="fa-solid fa-shield-heart text-white text-xs"></i></span> BEACON AI
  </div>
  <div id="account-widget" class="flex items-center gap-2"></div>
</nav>

<main class="wrap relative z-10 max-w-2xl mx-auto space-y-8 pb-12">

  <!-- Voice Intervention Section -->
  <section class="hero">
    <h1>Speak to <b>Beacon AI</b> — Instant<br>Emergency Guidance</h1>

    <!-- Language Selector Dropdown -->
    <div class="max-w-xs mx-auto my-6">
        <label for="language-select" class="block text-xs font-semibold text-slate-300 mb-1 tracking-wider uppercase">Response Language</label>
        <select id="language-select" class="w-full bg-slate-900/90 border border-slate-700 text-teal-300 text-xs rounded-xl p-3 focus:ring-teal-500 focus:border-teal-500 font-medium shadow-inner">
            <option value="English" selected>English</option>
            <option value="Malayalam">Malayalam (മലയാളം)</option>
            <option value="Tamil">Tamil (தமிழ்)</option>
            <option value="Hindi">Hindi (हिंदी)</option>
            <option value="Spanish">Spanish (Español)</option>
            <option value="Arabic">Arabic (العربية)</option>
        </select>
    </div>

    <!-- 3D Interactive Orb Stage -->
    <div class="orb-stage" id="orbStage">
      <div class="orb-halo"></div>
      <canvas id="orbCanvas" width="600" height="600" aria-label="Beacon voice orb, tap to speak"></canvas>
      <div class="mic-center">
        <i id="micIcon" class="fa-solid fa-microphone text-blue-700 text-sm"></i>
      </div>
    </div>

    <div class="speak-wrap">
      <button class="speak-btn" id="record-btn" onclick="toggleRecording()">
        <span class="dot"></span> <span id="record-btn-text">Speak with Beacon</span>
      </button>
      <span class="status-label" id="record-status">Tap the orb or button to start recording</span>
    </div>
  </section>

  <!-- Response Output Display -->
  <section id="output-pane" class="hidden bg-slate-900/80 backdrop-blur-md border border-teal-500/30 rounded-2xl p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <span class="text-xs font-mono text-teal-400 flex items-center gap-2">
              <i class="fa-solid fa-microchip"></i> Beacon Analysis Output
          </span>
      </div>

      <div id="loading-spinner" class="hidden text-center py-8">
          <i class="fa-solid fa-spinner fa-spin text-teal-400 text-3xl mb-3"></i>
          <p class="text-xs font-mono text-slate-400">Listening and synthesizing response...</p>
      </div>

      <div id="audio-reply" class="hidden"></div>
      <div id="script-results" class="space-y-4 text-sm"></div>
  </section>

  <!-- Emergency Contacts -->
  <section class="bg-gradient-to-br from-slate-900/90 to-slate-950/90 border border-slate-800 rounded-2xl p-5 shadow-xl">
      <h3 class="text-sm font-bold text-white uppercase tracking-wider mb-3 flex items-center gap-2">
          <i class="fa-solid fa-phone-volume text-emerald-400"></i> Emergency Contacts
      </h3>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <a href="tel:1-800-662-4357" class="block p-3 bg-slate-900/90 border border-slate-800 rounded-xl hover:border-emerald-500/60 transition">
              <div class="text-[11px] text-slate-400">SAMHSA Helpline</div>
              <div class="text-sm font-bold text-emerald-400 font-mono">1-800-662-4357</div>
          </a>
          <a href="tel:988" class="block p-3 bg-slate-900/90 border border-slate-800 rounded-xl hover:border-teal-500/60 transition">
              <div class="text-[11px] text-slate-400">Crisis Lifeline</div>
              <div class="text-sm font-bold text-teal-400 font-mono">Call/Text 988</div>
          </a>
          <a href="tel:911" class="block p-3 bg-slate-900/90 border border-red-900/60 rounded-xl hover:border-red-500/60 transition">
              <div class="text-[11px] text-slate-400">Immediate Danger</div>
              <div class="text-sm font-bold text-red-400 font-mono">Call 911</div>
          </a>
      </div>
  </section>

</main>

<script>
  // Session verification
  async function verifySession() {
      const token = localStorage.getItem('beacon_token');
      try {
          const res = await fetch('/api/auth/me', {
              headers: { 'Authorization': `Bearer ${token}` }
          });
          if (!res.ok) throw new Error('invalid session');
          const user = await res.json();
          localStorage.setItem('beacon_user', JSON.stringify(user));
          document.body.classList.add('beacon-authed');
          renderAccountWidget();
      } catch (err) {
          localStorage.removeItem('beacon_token');
          localStorage.removeItem('beacon_user');
          window.location.replace('/login.html');
      }
  }
  verifySession();

  window.addEventListener('pageshow', (event) => {
      if (event.persisted) verifySession();
  });

  async function authFetch(url, options = {}) {
      const token = localStorage.getItem('beacon_token');
      const headers = Object.assign({}, options.headers, {
          'Authorization': `Bearer ${token}`
      });
      const response = await fetch(url, { ...options, headers });
      if (response.status === 401) {
          localStorage.removeItem('beacon_token');
          localStorage.removeItem('beacon_user');
          window.location.replace('/login.html');
          throw new Error('Session expired. Redirecting to login...');
      }
      return response;
  }

  function renderAccountWidget() {
      const widget = document.getElementById('account-widget');
      const userRaw = localStorage.getItem('beacon_user');
      if (!userRaw) return;
      const user = JSON.parse(userRaw);
      widget.innerHTML = `
          <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800/80 border border-slate-700 text-slate-200 text-xs">
              <i class="fa-solid fa-circle-user text-teal-400"></i>
              <span>${user.username}</span>
          </div>
          <button onclick="logout()" class="px-3 py-1.5 rounded-lg bg-slate-800/80 border border-slate-700 text-slate-400 hover:text-rose-400 hover:border-rose-500/40 transition">
              <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </button>
      `;
  }

  function logout() {
      localStorage.removeItem('beacon_token');
      localStorage.removeItem('beacon_user');
      window.location.replace('/login.html');
  }

  // Audio Recording & WebRTC
  let mediaRecorder;
  let audioChunks = [];
  let isRecording = false;
  let recordedMimeType = 'audio/webm';
  let activeStream = null;

  async function toggleRecording() {
      const btnText = document.getElementById('record-btn-text');
      const micIcon = document.getElementById('micIcon');
      const status = document.getElementById('record-status');

      if (!isRecording) {
          let stream;
          try {
              stream = await navigator.mediaDevices.getUserMedia({
                  audio: {
                      echoCancellation: true,
                      noiseSuppression: true,
                      autoGainControl: true,
                      sampleRate: 48000
                  }
              });
          } catch (err) {
              status.innerText = "Microphone access denied or unavailable.";
              return;
          }
          activeStream = stream;

          const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'];
          recordedMimeType = candidates.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || 'audio/webm';

          mediaRecorder = new MediaRecorder(stream, {
              mimeType: recordedMimeType,
              audioBitsPerSecond: 128000
          });

          audioChunks = [];
          mediaRecorder.ondataavailable = event => { if (event.data.size > 0) audioChunks.push(event.data); };
          mediaRecorder.onstop = async () => {
              activeStream.getTracks().forEach(track => track.stop());
              const audioBlob = new Blob(audioChunks, { type: recordedMimeType });
              await sendAudioToGemini(audioBlob);
          };

          mediaRecorder.start();
          isRecording = true;
          setOrbState(true);
          micIcon.className = "fa-solid fa-stop text-red-600 text-sm";
          btnText.innerText = "Stop Recording";
          status.innerText = "Recording... tap again to stop and process";
      } else {
          mediaRecorder.stop();
          isRecording = false;
          setOrbState(false);
          micIcon.className = "fa-solid fa-microphone text-blue-700 text-sm";
          btnText.innerText = "Speak with Beacon";
          status.innerText = "Processing audio...";
      }
  }

  async function sendAudioToGemini(blob) {
      const pane = document.getElementById('output-pane');
      const spinner = document.getElementById('loading-spinner');
      const results = document.getElementById('script-results');
      const audioReplyBox = document.getElementById('audio-reply');
      const status = document.getElementById('record-status');
      const selectedLanguage = document.getElementById('language-select').value || 'English';

      pane.classList.remove('hidden');
      spinner.classList.remove('hidden');
      results.innerHTML = '';
      audioReplyBox.innerHTML = '';
      audioReplyBox.classList.add('hidden');

      const ext = recordedMimeType.includes('mp4') ? 'mp4' : recordedMimeType.includes('ogg') ? 'ogg' : 'webm';
      const formData = new FormData();
      formData.append('file', blob, `panic_audio.${ext}`);
      formData.append('user_type', 'individual');
      formData.append('language', selectedLanguage);

      try {
          const response = await authFetch('/api/voice-intervention', { method: 'POST', body: formData });
          const res = await response.json();
          if (!response.ok) {
              throw new Error(res.detail || 'Server error processing audio.');
          }

          let parsed;
          try {
              parsed = JSON.parse(res.data);
          } catch (e) {
              const sanitized = res.data.replace(/[\u0000-\u001F\u007F-\u009F]/g, " ");
              parsed = JSON.parse(sanitized);
          }

          spinner.classList.add('hidden');
          results.innerHTML = `
            <div class="p-3 bg-teal-950/40 border border-teal-500/40 rounded-xl">
              <span class="text-xs font-mono text-teal-400 font-bold block mb-1">WHAT WE HEARD</span>
              <p class="text-xs text-slate-200">${parsed.vocal_risk_analysis}</p>
            </div>
            <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl">
              <span class="text-xs font-mono text-emerald-400 font-bold block mb-1">SPOKEN RESPONSE</span>
              <p class="text-xs font-mono text-slate-300">"${parsed.deescalation_script}"</p>
            </div>
            <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl">
              <span class="text-xs font-mono text-amber-400 font-bold block mb-1">RIGHT NOW</span>
              <p class="text-xs text-slate-300">${parsed.immediate_safety_steps}</p>
            </div>
          `;

          if (!res.audio_error && res.audio_base64) {
              const src = `data:${res.audio_mime || 'audio/wav'};base64,${res.audio_base64}`;
              audioReplyBox.classList.remove('hidden');
              audioReplyBox.innerHTML = `<audio controls autoplay class="w-full" src="${src}"></audio>`;
          } else {
              audioReplyBox.classList.remove('hidden');
              audioReplyBox.innerHTML = `
                  <div class="p-3 bg-amber-950/50 border border-amber-500/50 rounded-xl flex items-center gap-3 text-amber-300">
                      <i class="fa-solid fa-triangle-exclamation text-amber-400 text-lg"></i>
                      <div>
                          <p class="text-xs font-bold">Audio Output Unavailable</p>
                          <p class="text-[11px] text-amber-200/80">Voice generation paused. Please refer to the text response below.</p>
                      </div>
                  </div>
              `;
          }

          status.innerText = "Tap the orb or button to start recording";
      } catch (err) {
          spinner.classList.add('hidden');
          results.innerHTML = `<p class="text-red-400 text-xs">Audio Processing Error: ${err.message}</p>`;
          status.innerText = "Tap the orb or button to start recording";
      }
  }

  // 3D Fibonacci Sphere Voice Orb Animation Engine
  let setOrbState = function(listening) {};

  (function(){
    const canvas = document.getElementById('orbCanvas');
    const ctx = canvas.getContext('2d');
    const stage = document.getElementById('orbStage');

    const W = canvas.width, H = canvas.height;
    const cx = W/2, cy = H/2;
    const baseRadius = W * 0.34;

    const POINT_COUNT = 900;
    const points = [];
    const golden = Math.PI * (3 - Math.sqrt(5));

    for(let i=0;i<POINT_COUNT;i++){
      const y = 1 - (i / (POINT_COUNT - 1)) * 2;
      const radiusAtY = Math.sqrt(1 - y*y);
      const theta = golden * i;
      const x = Math.cos(theta) * radiusAtY;
      const z = Math.sin(theta) * radiusAtY;
      points.push({x, y, z, phase: Math.random()*Math.PI*2, speed: 0.6 + Math.random()*0.8});
    }

    let listening = false;
    let angleY = 0;
    let angleX = 0.15;
    let t = 0;
    let energy = 0.25;
    let targetEnergy = 0.25;

    setOrbState = function(state){
      listening = state;
      stage.classList.toggle('listening', state);
      targetEnergy = state ? 0.85 : 0.25;
    };

    canvas.addEventListener('click', () => toggleRecording());

    function project(p, r){
      let x = p.x, y = p.y, z = p.z;

      let cosY = Math.cos(angleY), sinY = Math.sin(angleY);
      let x1 = x * cosY - z * sinY;
      let z1 = x * sinY + z * cosY;

      let cosX = Math.cos(angleX), sinX = Math.sin(angleX);
      let y1 = y * cosX - z1 * sinX;
      let z2 = y * sinX + z1 * cosX;

      const scale = r * (1 + z2 * 0.15);
      const px = cx + x1 * scale;
      const py = cy + y1 * scale;
      const depth = z2;
      return {px, py, depth};
    }

    function draw(){
      ctx.clearRect(0,0,W,H);

      energy += (targetEnergy - energy) * 0.05;
      if(listening){
        targetEnergy = 0.55 + Math.sin(t*3.1)*0.15 + Math.sin(t*7.3)*0.08 + 0.15*Math.random();
      }

      const wobble = listening ? 0.10 : 0.035;
      const r = baseRadius * (1 + Math.sin(t*1.2) * 0.02);

      const projected = points.map(p => {
        const distort = 1 + Math.sin(t*p.speed + p.phase) * wobble * energy;
        const pr = project(p, r * distort);
        return {...pr, base:p};
      });
      projected.sort((a,b)=>a.depth - b.depth);

      for(const pt of projected){
        const depthNorm = (pt.depth + 1) / 2;
        const alpha = 0.12 + depthNorm * 0.75;
        const size = 0.6 + depthNorm * 1.8 + energy*0.6;

        const hue = 220 + depthNorm*20;
        ctx.beginPath();
        ctx.fillStyle = `hsla(${hue}, 100%, ${60 + depthNorm*20}%, ${alpha})`;
        ctx.arc(pt.px, pt.py, size, 0, Math.PI*2);
        ctx.fill();
      }

      angleY += 0.0032 + energy*0.0025;
      t += 0.016;

      requestAnimationFrame(draw);
    }

    draw();
  })();
</script>

</body>
</html>
