<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | BEACON</title>
    <script>
        // Already signed in? Skip straight to the app instead of showing the form.
        if (localStorage.getItem('beacon_token')) {
            window.location.replace('/app.html');
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdfa', 500: '#14b8a6', 600: '#0d9488', 900: '#134e4a' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-teal-500 selection:text-white">

    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50 px-6 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="/" class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-500 to-emerald-400 flex items-center justify-center font-black text-slate-950 text-xl shadow-lg shadow-teal-500/20">
                    <i class="fa-solid fa-shield-heart"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white">BEACON</h1>
                    <p class="text-xs text-slate-400">Recovery & Prevention Platform</p>
                </div>
            </a>
            <a href="/signup.html" class="text-xs font-semibold text-teal-400 hover:text-teal-300 transition">
                New here? <span class="underline">Create an account</span>
            </a>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 sm:px-6 py-14">
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-xl">
            <div class="mb-6">
                <span class="text-xs font-semibold text-teal-400 uppercase tracking-wider font-mono">Welcome Back</span>
                <h2 class="text-2xl font-bold text-white mt-1">Sign in to Beacon</h2>
            </div>

            <form id="login-form" class="space-y-4" novalidate>
                <div>
                    <label class="text-xs font-semibold text-slate-300 block mb-1.5">Username or email</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                        <input id="identifier" type="text" autocomplete="username" placeholder="jordan_smith or you@example.com"
                            class="w-full bg-slate-950 border border-slate-700 rounded-xl pl-10 pr-3 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-teal-500 transition" />
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="text-xs font-semibold text-slate-300">Password</label>
                        <a href="/forgot-password.html" class="text-[11px] font-semibold text-teal-400 hover:text-teal-300">Forgot password?</a>
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••"
                            class="w-full bg-slate-950 border border-slate-700 rounded-xl pl-10 pr-10 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-teal-500 transition" />
                        <button type="button" onclick="togglePassword('password', this)"
                            class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 text-sm">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div id="form-error" class="hidden p-3 bg-rose-950/40 border border-rose-500/40 rounded-xl text-rose-300 text-xs"></div>

                <button type="submit" id="submit-btn"
                    class="w-full bg-teal-600 hover:bg-teal-500 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-teal-600/20 flex items-center justify-center gap-2">
                    <span>Sign In</span>
                    <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>
                </button>
            </form>

            <p class="text-[11px] text-slate-500 text-center mt-6">
                In a crisis right now? <span class="text-emerald-400 font-semibold">Call or text 988</span> — no account needed.
            </p>
        </section>
    </main>

    <script>
        const API_BASE = '';

        // Turns a FastAPI error `detail` into plain text no matter its shape --
        // usually a string, but validation errors can come back as a list of
        // {msg: ...} objects, which JS would otherwise render as "[object Object]".
        function safeDetail(detail) {
            if (!detail) return '';
            if (typeof detail === 'string') return detail;
            if (Array.isArray(detail)) {
                return detail.map(d => (typeof d === 'string' ? d : d.msg || JSON.stringify(d))).join('; ');
            }
            return detail.msg || JSON.stringify(detail);
        }

        function togglePassword(id, btn) {
            const input = document.getElementById(id);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errBox = document.getElementById('form-error');
            const btn = document.getElementById('submit-btn');
            errBox.classList.add('hidden');

            const identifier = document.getElementById('identifier').value.trim();
            const password = document.getElementById('password').value;

            if (!identifier || !password) {
                errBox.innerText = 'Please enter your username/email and password.';
                errBox.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(safeDetail(data.detail) || 'Login failed.');
                }

                localStorage.setItem('beacon_token', data.access_token);
                localStorage.setItem('beacon_user', JSON.stringify(data.user));
                window.location.href = '/app.html';
            } catch (err) {
                errBox.innerText = err.message;
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<span>Sign In</span><i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>';
            }
        });
    </script>
</body>

</html>
