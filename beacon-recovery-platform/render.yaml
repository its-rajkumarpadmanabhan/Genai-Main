databases:
  - name: beacon-db
    plan: free

services:
  - type: web
    name: beacon-recovery-platform
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: "Beacon Recovery Platform"
      - key: FRONTEND_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: beacon-db
          property: connectionString
