databases:
  - name: beacon-db
    plan: free

services:
  - type: web
    name: beacon-django
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn beacon.wsgi:application --bind 0.0.0.0:$PORT --workers 4
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: "Beacon Recovery Platform"
      - key: FRONTEND_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: beacon-db
          property: connectionString
