<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carewell — Directory</title>
<script>
  (function(){
    const token = localStorage.getItem('beacon_token') || localStorage.getItem('access_token');
    if(!token){ window.location.href = '/login'; }
  })();
  document.addEventListener('contextmenu', event => {
    event.preventDefault();
  });
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2A22; --paper:#EAF0EC; --surface:#FFFFFF; --line:#D7DFD9;
    --pine:#33604F; --pine-deep:#25473A; --brick:#AE4436; --brick-soft:#F3DFDA;
    --slate:#4A6E8C; --slate-soft:#DCE7EF; --muted:#6E7D75; --amber:#B9873A; --amber-soft:#F1E3CB;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .app{display:grid;grid-template-columns:220px 1fr;max-width:1440px;margin:0 auto;min-height:100vh;}

  .sidebar{background:var(--pine-deep);color:#EFF3F0;padding:28px 20px;display:flex;flex-direction:column;gap:30px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(160deg,#4C8A72,#2C5344);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:17px;flex-shrink:0;}
  .brand-name{font-family:'Fraunces',serif;font-size:17px;font-weight:600;}
  .brand-sub{font-size:11px;color:#9FB6AB;font-family:'JetBrains Mono',monospace;letter-spacing:.5px;}
  nav{display:flex;flex-direction:column;gap:3px;}
  nav button{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:#D7E4DE;font-size:13.5px;font-weight:500;border:none;background:transparent;cursor:pointer;text-align:left;width:100%;font-family:inherit;}
  nav button svg{width:16px;height:16px;flex-shrink:0;}
  nav button.active{background:#EFF3F0;color:var(--pine-deep);}
  nav button:not(.active):hover{background:rgba(255,255,255,.08);}
  .sidebar-foot{margin-top:auto;}
  .help-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius);padding:14px;font-size:12.5px;color:#C7DACF;}
  .help-card b{display:block;font-family:'Fraunces',serif;font-size:14px;color:#EFF3F0;margin-bottom:4px;}

  main{padding:24px 26px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
  .breadcrumb{font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:var(--muted);}
  .breadcrumb span{color:var(--ink);}

  .tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;width:fit-content;margin-bottom:18px;}
  .tabs button{border:none;background:transparent;padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;}
  .tabs button.active{background:var(--pine-deep);color:#EFF3F0;}

  .filter-bar{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:18px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
  .filter-field{display:flex;flex-direction:column;gap:5px;min-width:150px;}
  .filter-field.grow{flex:1;min-width:200px;}
  .filter-field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;}
  .filter-field input,.filter-field select{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}

  .results-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .results-head h2{font-family:'Fraunces',serif;font-size:16.5px;font-weight:600;margin:0;}
  .results-count{font-size:12px;color:var(--muted);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px;display:flex;flex-direction:column;gap:10px;}
  .card-top{display:flex;gap:11px;align-items:center;}
  .c-avatar{width:42px;height:42px;border-radius:11px;background:var(--slate-soft);color:var(--slate);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .c-avatar svg{width:20px;height:20px;}
  .c-avatar.amber{background:var(--amber-soft);color:var(--amber);}
  .c-name{font-family:'Fraunces',serif;font-size:15px;font-weight:600;}
  .c-code{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);}
  .c-role{font-size:11.5px;color:var(--pine);font-weight:600;}
  
  .star-badge{display:inline-flex;align-items:center;gap:4px;background:var(--amber-soft);color:var(--amber);font-weight:700;font-size:12px;padding:2px 8px;border-radius:6px;width:fit-content;}

  .c-tags{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--paper);color:var(--muted);}
  .tag.loc{background:var(--slate-soft);color:var(--slate);}
  .tag.exp{background:#DCE9E2;color:var(--pine);}
  .c-meta{font-size:12px;color:var(--muted);line-height:1.5;border-top:1px dashed var(--line);padding-top:9px;}
  
  .c-actions{display:flex;gap:6px;margin-top:auto;}
  .btn-sm{flex:1;padding:8px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer;}
  .btn-sm.primary{background:var(--pine-deep);color:#fff;}
  .btn-sm.secondary{background:var(--paper);color:var(--ink);border:1px solid var(--line);}

  .empty-note{grid-column:1/-1;text-align:center;padding:40px 10px;color:var(--muted);font-size:13px;}

  /* Star Rating Modal */
  .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(30,42,34,.5);align-items:center;justify-content:center;z-index:90;padding:20px;}
  .modal-backdrop.open{display:flex;}
  .modal{background:var(--surface);border-radius:18px;max-width:420px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.2);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-head h3{font-family:'Fraunces',serif;font-size:18px;margin:0;}
  .modal-close{border:none;background:var(--paper);width:30px;height:30px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:16px;}

  .star-select{display:flex;gap:8px;justify-content:center;margin:16px 0;font-size:28px;cursor:pointer;}
  .star-select span{color:#D7DFD9;transition:color .15s;}
  .star-select span.active{color:#B9873A;}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
  .field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
  .btn-submit{width:100%;background:var(--pine-deep);color:#EFF3F0;border:none;border-radius:10px;padding:11px;font-size:13.5px;font-weight:700;cursor:pointer;margin-top:6px;}

  @media (max-width:820px){
    .app{grid-template-columns:1fr;}
    .sidebar{flex-direction:row;overflow-x:auto;align-items:center;gap:16px;}
    .sidebar nav{flex-direction:row;}
    .sidebar-foot,.brand-sub{display:none;}
  }
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="brand">
      <div class="brand-mark">C</div>
      <div><div class="brand-name">Carewell</div><div class="brand-sub">DIRECTORY</div></div>
    </div>
    <nav>
      <button class="active" onclick="window.location.href='/doctor-caretaker-list'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Directory</span></button>
      <button onclick="window.location.href='/app'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Voice AI Engine</span></button>
      <button onclick="window.location.href='/voice-timeline'" id="sidebarTimelineBtn" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span>Voice AI Health Timeline</span></button>
      <button onclick="goToMyDashboard()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>My Dashboard</span></button>
      <button onclick="localStorage.clear(); window.location.href='/login';"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span>Logout</span></button>
    </nav>
    <div class="sidebar-foot">
      <div class="help-card"><b>Need help?</b>Reach platform support any time.</div>
    </div>
  </div>

  <!-- MAIN -->
  <main>
    <div class="topbar">
      <div class="breadcrumb">Directory › <span id="bcLabel">Doctors</span></div>
    </div>

    <div class="tabs">
      <button class="active" id="tabDoctors" onclick="switchTab('doctors')">Doctors</button>
      <button id="tabCaretakers" onclick="switchTab('caretakers')">Caretakers</button>
    </div>

    <!-- FILTER BAR -->
    <div class="filter-bar" style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:20px;">
      <div class="filter-field grow" style="flex:1;min-width:200px;">
        <label>Search Name / Details</label>
        <input type="text" id="searchInput" placeholder="Search by name, code or department..." oninput="renderList()">
      </div>
      <div class="filter-field" style="width:140px;">
        <label>Gender</label>
        <select id="filterGender" onchange="renderList()" style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--paper);color:var(--ink);">
          <option value="">All Genders</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>
      <div class="filter-field" style="width:160px;">
        <label>Experience / Age</label>
        <select id="filterExp" onchange="renderList()" style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--paper);color:var(--ink);">
          <option value="">Any Experience</option>
          <option value="1-3">1 - 3 Years</option>
          <option value="4-6">4 - 6 Years</option>
          <option value="7+">7+ Years</option>
        </select>
      </div>
      <div class="filter-field" style="width:160px;">
        <label>Location</label>
        <input type="text" id="filterLocation" placeholder="City / Area..." oninput="renderList()" style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--paper);color:var(--ink);">
      </div>
    </div>

    <div class="results-head">
      <h2 id="resultsTitle">Doctors Directory</h2>
      <span class="results-count" id="resultsCount"></span>
    </div>

    <div class="grid" id="cardGrid"></div>
  </main>
</div>

<!-- REVIEW / STAR RATING MODAL -->
<div class="modal-backdrop" id="reviewModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="reviewModalTitle">Star & Review</h3>
      <button class="modal-close" onclick="closeReviewModal()">✕</button>
    </div>
    <form id="reviewForm" onsubmit="submitReview(event)">
      <div class="star-select" id="starPicker">
        <span onclick="setRating(1)">★</span>
        <span onclick="setRating(2)">★</span>
        <span onclick="setRating(3)">★</span>
        <span onclick="setRating(4)">★</span>
        <span onclick="setRating(5)">★</span>
      </div>
      <div class="field">
        <label>Review Comment (Optional)</label>
        <textarea id="reviewComment" rows="3" placeholder="Share your experience with this specialist..."></textarea>
      </div>
      <button class="btn-submit" type="submit">Submit Star Review</button>
    </form>
  </div>
</div>

<script>
const ICON = {
  stetho: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2v4M16 2v4M3 8h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>',
  heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.5 1-1a5.5 5.5 0 0 0 0-7.9z"/></svg>'
};

let currentTab = 'doctors';
let doctorsList = [];
let caretakersList = [];
let reviewTarget = { type: '', id: null, name: '' };
let currentRating = 5;

function getAuthHeader(){
  const token = localStorage.getItem('access_token') || localStorage.getItem('beacon_token');
  return token ? { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };
}

async function fetchDirectory(){
  try {
    const res = await fetch('/api/auth/directory/search', { headers: getAuthHeader() });
    if(res.ok){
      const data = await res.json();
      doctorsList = data.doctors || [];
      caretakersList = data.caretakers || [];
      renderList();
    }
  } catch(e){ console.log(e); }
}

function switchTab(tab){
  currentTab = tab;
  document.getElementById('tabDoctors').classList.toggle('active', tab==='doctors');
  document.getElementById('tabCaretakers').classList.toggle('active', tab==='caretakers');
  document.getElementById('bcLabel').textContent = tab==='doctors' ? 'Doctors' : 'Caretakers';
  document.getElementById('resultsTitle').textContent = tab==='doctors' ? 'Doctors Directory' : 'Caretakers Directory';
  renderList();
}

function renderList(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const filterG = document.getElementById('filterGender').value.toLowerCase();
  const filterLoc = document.getElementById('filterLocation').value.trim().toLowerCase();
  const filterE = document.getElementById('filterExp').value;

  const container = document.getElementById('cardGrid');
  const items = currentTab === 'doctors' ? doctorsList : caretakersList;

  const filtered = items.filter(item => {
    const name = (item.full_name || item.username || '').toLowerCase();
    const code = (item.doctor_code || item.caretaker_code || '').toLowerCase();
    const loc = (item.location || '').toLowerCase();
    const state = (item.state || '').toLowerCase();
    const hospital = (item.hospital_name || '').toLowerCase();
    const gender = (item.gender || '').toLowerCase();
    const expYears = parseInt(item.experience_years || 0);

    const matchesQ = !q || name.includes(q) || code.includes(q) || loc.includes(q) || state.includes(q) || hospital.includes(q) || (item.major_department||'').toLowerCase().includes(q);
    const matchesGender = !filterG || gender === filterG;
    const matchesLoc = !filterLoc || loc.includes(filterLoc) || state.includes(filterLoc) || hospital.includes(filterLoc);

    let matchesExp = true;
    if(filterE === '1-3') matchesExp = expYears >= 1 && expYears <= 3;
    else if(filterE === '4-6') matchesExp = expYears >= 4 && expYears <= 6;
    else if(filterE === '7+') matchesExp = expYears >= 7;

    return matchesQ && matchesGender && matchesLoc && matchesExp;
  });

  document.getElementById('resultsCount').textContent = `${filtered.length} of ${items.length} ${currentTab}`;

  if(!filtered.length){
    container.innerHTML = `<div class="empty-note">No ${currentTab} found matching your search.</div>`;
    return;
  }

  container.innerHTML = filtered.map(item => {
    const rawName = item.full_name || item.username || 'Provider';
    const name = (currentTab === 'doctors' && !rawName.startsWith('Dr.')) ? 'Dr. ' + rawName : rawName;
    const code = item.doctor_code || item.caretaker_code || (currentTab==='doctors'?'DOC-000':'CAR-000');
    const dept = item.major_department || (currentTab==='doctors'?'General Medicine':'Caregiver');
    const fee = '₹' + (item.consultation_fee || 0);
    const exp = (item.experience_years || 0) + ' yrs exp.';
    const rating = item.rating_avg ? item.rating_avg.toFixed(1) : '5.0';
    const count = item.reviews_count || 0;
    const availStatus = item.availability_status || 'Active Today';

    let availTag = '';
    if(availStatus === 'On Leave Today'){
      availTag = '<span class="tag" style="background:var(--brick-soft);color:var(--brick);font-weight:700;">🔴 On Leave Today</span>';
    } else if(availStatus === 'On Break'){
      availTag = '<span class="tag" style="background:var(--amber-soft);color:var(--amber);font-weight:700;">🟡 On Break</span>';
    } else if(availStatus === 'Off Duty'){
      availTag = '<span class="tag" style="background:#E5E7EB;color:#374151;font-weight:700;">⚪ Off Duty</span>';
    } else {
      availTag = '<span class="tag" style="background:#DCE9E2;color:var(--pine);font-weight:700;">🟢 Active Today</span>';
    }

    return `
      <div class="card">
        <div class="card-top">
          <div class="c-avatar ${currentTab==='caretakers'?'amber':''}">${currentTab==='doctors'?ICON.stetho:ICON.heart}</div>
          <div>
            <div class="c-name">${name}</div>
            <div class="c-code">${code}</div>
            <div class="c-role">${dept}</div>
          </div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;">
          <div class="star-badge" style="margin:0;">★ ${rating} <span style="font-weight:400;font-size:10.5px;color:var(--muted);">(${count})</span></div>
          ${currentTab==='doctors' ? availTag : ''}
        </div>

        <div class="c-tags">
          <span class="tag loc" title="${item.location || 'Local'}">
            📍 ${currentTab==='doctors' ? 
              ((item.hospital_name || item.location || item.state) ? `${item.hospital_name || ''}${item.location ? ' · ' + item.location : ''}${item.state ? ', ' + item.state : ''}` : (item.location || 'Local')) : 
              (item.location || 'Local')
            }
          </span>
          <span class="tag exp">${exp}</span>
        </div>
        <div class="c-meta">Fee: <b>${fee}</b> · Hours: ${item.available_hours || 'Available'}</div>

        <div class="c-actions">
          ${currentTab==='doctors' ? 
            (availStatus === 'On Leave Today' ?
              `<button class="btn-sm secondary" style="opacity:0.65;cursor:not-allowed;" onclick="alert('${name.replace(/'/g, "\\'")} is currently on leave today.')">On Leave</button>` :
              `<button class="btn-sm primary" onclick="bookDoctor(${item.user_id || item.id})">Book</button>`
            ) :
            `<button class="btn-sm primary" onclick="requestCaretaker(${item.user_id || item.id})">Request</button>`
          }
          <button class="btn-sm secondary" onclick="openReviewModal('${currentTab==='doctors'?'doctor':'caretaker'}', ${item.id}, '${name.replace(/'/g, "\\'")}')">Star ★</button>
        </div>
      </div>
    `;
  }).join('');
}

function setRating(r){
  currentRating = r;
  const stars = document.querySelectorAll('#starPicker span');
  stars.forEach((s, idx) => s.classList.toggle('active', idx < r));
}

function openReviewModal(type, id, name){
  reviewTarget = { type, id, name };
  setRating(5);
  document.getElementById('reviewModalTitle').textContent = 'Star & Review ' + name;
  document.getElementById('reviewComment').value = '';
  document.getElementById('reviewModal').classList.add('open');
}
function closeReviewModal(){ document.getElementById('reviewModal').classList.remove('open'); }

async function submitReview(e){
  e.preventDefault();
  const comment = document.getElementById('reviewComment').value;
  try {
    const res = await fetch('/api/auth/review', {
      method: 'POST',
      headers: getAuthHeader(),
      body: JSON.stringify({
        target_type: reviewTarget.type,
        target_id: reviewTarget.id,
        rating: currentRating,
        comment: comment
      })
    });
    if(res.ok){
      closeReviewModal();
      alert('Thank you for starring ' + reviewTarget.name + '!');
      fetchDirectory();
    } else {
      const err = await res.json();
      alert(err.detail || 'Could not submit review.');
    }
  } catch(err){ alert(err.message); }
}

async function bookDoctor(docUserId){
  const userRaw = localStorage.getItem('beacon_user');
  let userRole = 'patient';
  if(userRaw){
    try { userRole = JSON.parse(userRaw).role || 'patient'; } catch(e){}
  }

  let selectedPatientId = null;
  if(userRole === 'caretaker'){
    try {
      const pRes = await fetch('/api/auth/caretaker/patients', { headers: getAuthHeader() });
      if(pRes.ok){
        const data = await pRes.json();
        const assignedPatients = data.active || (Array.isArray(data) ? data : []);
        if(!assignedPatients || assignedPatients.length === 0){
          alert('You have no assigned patients under your care. Accept a patient care request first before booking a doctor appointment.');
          return;
        }
        let patMsg = 'Select Patient to book appointment for:\n\n';
        assignedPatients.forEach((p, idx) => {
          patMsg += `${idx + 1}. ${p.full_name} (${p.patient_code}) — Enter ID: ${p.patient_id}\n`;
        });
        const chosenIdStr = prompt(patMsg + '\nEnter Patient ID:');
        if(!chosenIdStr) return;
        selectedPatientId = parseInt(chosenIdStr.trim());
        const validPat = assignedPatients.find(p => p.patient_id == selectedPatientId);
        if(!validPat){
          alert('Invalid Patient ID selected. Please select a valid patient under your care.');
          return;
        }
      }
    } catch(err){ alert(err.message); return; }
  }

  const today = new Date();
  const dayOfWeek = today.getDay();
  const distanceToMon = (dayOfWeek === 0 ? -6 : 1 - dayOfWeek);
  const monDate = new Date(today);
  monDate.setDate(today.getDate() + distanceToMon);
  const sunDate = new Date(monDate);
  sunDate.setDate(monDate.getDate() + 6);

  const monStr = monDate.toISOString().split('T')[0];
  const sunStr = sunDate.toISOString().split('T')[0];

  const appDate = prompt(`Enter appointment date (YYYY-MM-DD).\nNote: Appointments can only be booked for the current week (${monStr} to ${sunStr}):`, monStr);
  if(!appDate) return;

  const appTime = prompt('Enter appointment time slot (e.g. 10:00 AM, 02:30 PM):', '10:00 AM');
  if(!appTime) return;
  
  const appTypeChoice = prompt('Enter appointment type:\n1. Online (Video Call)\n2. Offline (In-Person)\n\nType 1 or 2:', '1');
  if(!appTypeChoice) return;
  const appType = (appTypeChoice.trim() === '2') ? 'offline' : 'online';

  const reason = prompt('Enter reason for appointment:');

  const payload = {
    doctor_id: docUserId,
    appointment_date: appDate,
    time_slot: appTime,
    reason: reason || '',
    appointment_type: appType,
    booked_by: (userRole === 'caretaker' ? 'caretaker' : 'patient')
  };
  if(selectedPatientId){
    payload.patient_id = selectedPatientId;
  }

  try {
    const res = await fetch('/api/auth/appointments/book', {
      method: 'POST',
      headers: getAuthHeader(),
      body: JSON.stringify(payload)
    });
    if(res.ok){ alert('Appointment request sent to doctor! Status: Waiting for confirmation.'); }
    else { const d = await res.json(); alert(d.detail || 'Booking failed.'); }
  } catch(e){ alert(e.message); }
}

async function requestCaretaker(careUserId){
  try {
    const res = await fetch('/api/auth/patient/caretaker-request', {
      method: 'POST',
      headers: getAuthHeader(),
      body: JSON.stringify({ caretaker_id: careUserId })
    });
    if(res.ok){ alert('Caretaker care request sent successfully!'); }
    else { const d = await res.json(); alert(d.detail || 'Request failed.'); }
  } catch(e){ alert(e.message); }
}

function goToMyDashboard(){
  const userRaw = localStorage.getItem('beacon_user');
  if(!userRaw){ window.location.href = '/login'; return; }
  const user = JSON.parse(userRaw);
  const role = user.role || 'patient';
  const targetPage = role === 'admin' ? '/admin-dashboard' :
                     role === 'doctor' ? '/doctor-profile' :
                     role === 'caretaker' ? '/caretaker-dashboard' : '/patient-profile';
  window.location.href = targetPage;
}

document.addEventListener('DOMContentLoaded', () => {
  const userRaw = localStorage.getItem('beacon_user');
  if(userRaw){
    try {
      const u = JSON.parse(userRaw);
      if(u.role === 'patient' || u.role === 'admin'){
        const btn = document.getElementById('sidebarTimelineBtn');
        if(btn) btn.style.display = 'flex';
      }
      if(u.role === 'caretaker'){
        const tabC = document.getElementById('tabCaretakers');
        if(tabC) tabC.style.display = 'none';
        switchTab('doctors');
      }
    } catch(e){}
  }
  fetchDirectory();
});
</script>
