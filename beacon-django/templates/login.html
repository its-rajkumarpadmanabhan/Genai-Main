<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beacon AI — Log In</title>
<script>
  (function(){
    const token = localStorage.getItem('beacon_token') || localStorage.getItem('access_token');
    const userRaw = localStorage.getItem('beacon_user');
    if(token && userRaw){
      try {
        const user = JSON.parse(userRaw);
        const role = user.role || 'patient';
        const target = role === 'admin' ? '/admin-dashboard' :
                       role === 'doctor' ? '/doctor-profile' :
                       role === 'caretaker' ? '/caretaker-dashboard' : '/patient-profile';
        window.location.href = target;
      } catch(e){}
    }
  })();
  document.addEventListener('contextmenu', event => {
    event.preventDefault();
  });
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  if (localStorage.getItem('beacon_token') || localStorage.getItem('access_token')) {
    const userRaw = localStorage.getItem('beacon_user');
    if (userRaw) {
      try {
        const u = JSON.parse(userRaw);
        const role = u.role || 'patient';
        const targetPage = role === 'admin' ? '/admin-dashboard' :
                           role === 'doctor' ? '/doctor-profile' :
                           role === 'caretaker' ? '/caretaker-dashboard' : '/patient-profile';
        window.location.replace(targetPage);
      } catch(e){}
    }
  }
</script>
<style>
  :root{
    --ink:#20042E; --paper:#FAF5EE; --surface:#FFFFFF; --line:#E6D5C3;
    --pine:#804A8A; --pine-deep:#3A0353; --pine-soft:#F3E8F5; --brick:#C24141; --brick-soft:#FCEAEA;
    --slate:#F59E51; --slate-soft:#FFF2E5; --muted:#6C5275; --amber:#F59E51; --amber-soft:#FFF2E5;
    --amber-gold:#F8D299; --gold-deep:#D97E30;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:linear-gradient(135deg, #FAF5EE 0%, #F5EAE0 100%);color:var(--ink);font-family:'Inter',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}

  #view-auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 20%, #FAF5EE 0%, #F5EAE0 100%);}
  .auth-card{width:100%;max-width:440px;background:var(--surface);border:2px solid #E6D5C3;border-radius:20px;padding:32px;box-shadow:0 20px 60px rgba(58,3,83,0.15);}
  .auth-brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:8px;}
  .auth-brand .brand-mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg, #F59E51, #F8D299);color:#3A0353;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:800;font-size:22px;box-shadow:0 4px 12px rgba(245,158,81,0.4);}
  .auth-brand .brand-name{font-family:'Fraunces',serif;font-size:24px;font-weight:700;color:#3A0353;}
  .auth-sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 24px;}

  .role-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px;}
  .role-picker button{padding:12px 4px;border-radius:11px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-size:11.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px;}
  .role-picker button svg{width:18px;height:18px;}
  .role-picker button.active{border-color:var(--amber);background:#FFF2E5;color:var(--pine-deep);}

  .auth-tabs{display:flex;gap:6px;background:#F3E8F5;border-radius:12px;padding:5px;margin-bottom:20px;}
  .auth-tabs button{flex:1;border:none;background:transparent;padding:10px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;transition:all 0.15s ease;}
  .auth-tabs button.active{background:linear-gradient(135deg, #F59E51, #F8D299);color:#20042E;box-shadow:0 3px 10px rgba(245,158,81,0.35);}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;font-weight:700;color:var(--pine-deep);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
  .field input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;font-size:13.5px;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);transition:border-color 0.15s ease;}
  .field input:focus{outline:none;border-color:var(--pine);background:#FFFFFF;}

  .btn-primary{width:100%;background:linear-gradient(135deg, #3A0353 0%, #804A8A 100%);color:#FFFFFF;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;box-shadow:0 4px 14px rgba(58,3,83,0.3);transition:transform 0.15s ease, box-shadow 0.15s ease;}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(58,3,83,0.4);}

  .form-msg{font-size:12px;text-align:center;margin-top:12px;min-height:16px;color:var(--brick);}
  .form-sublink{text-align:center;font-size:12px;margin-top:14px;color:var(--muted);}
  .form-sublink a{color:var(--pine);font-weight:600;}
</style>
</head>
<body>

<div id="view-auth">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-mark">B</div>
      <div class="brand-name">Beacon AI</div>
    </div>
    <p class="auth-sub">Welcome back! Sign in to your portal.</p>

    <div class="auth-tabs">
      <button class="active">Log in</button>
      <button onclick="window.location.href='/signup'">Sign up</button>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field">
        <label>Username or Email</label>
        <input id="loginId" type="text" placeholder="Enter your username or email" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input id="loginPw" type="password" placeholder="••••••••" required>
      </div>
      <button class="btn-primary" type="submit" id="submitBtn">Log in</button>
    </form>

    <div class="form-msg" id="authMsg"></div>

    <div class="form-sublink">
      <a href="/forgot-password">Forgot password?</a>
    </div>
  </div>
</div>

<script>
  async function handleLogin(e){
    e.preventDefault();
    const msg = document.getElementById('authMsg');
    const btn = document.getElementById('submitBtn');
    msg.textContent = '';
    msg.className = 'form-msg';
    
    const identifier = document.getElementById('loginId').value.trim();
    const password = document.getElementById('loginPw').value;

    if(!identifier || !password){
      msg.textContent = 'Please enter username/email and password.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Signing in...';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identifier, password })
      });
      
      const ct = res.headers.get('content-type') || '';
      let data = {};
      if(ct.includes('application/json')){
        data = await res.json();
      } else {
        const rawText = await res.text();
        data = { detail: rawText.includes('detail') ? rawText : ('Server Error (' + res.status + '). Please check server database/logs.') };
      }

      if(!res.ok){
        // Email not verified — send to signup page to complete OTP step
        if(data.detail === 'email_not_verified'){
          msg.className = 'form-msg';
          msg.innerHTML = '⚠️ Your email is not verified yet. <a href="/signup" style="color:var(--pine);font-weight:600;text-decoration:underline;">Click here to verify your OTP</a>.';
          btn.disabled = false;
          btn.textContent = 'Log in';
          return;
        }
        throw new Error(data.detail || ('Login failed with status ' + res.status));
      }

      localStorage.setItem('beacon_token', data.access_token);
      localStorage.setItem('access_token', data.access_token);
      localStorage.setItem('beacon_user', JSON.stringify(data.user));

      const role = data.user && data.user.role ? data.user.role : 'patient';
      const targetPage = role === 'admin' ? '/admin-dashboard' :
                         role === 'doctor' ? '/doctor-profile' :
                         role === 'caretaker' ? '/caretaker-dashboard' : '/app';

      window.location.href = targetPage;
    } catch(err){
      msg.textContent = err.message;
      btn.disabled = false;
      btn.textContent = 'Log in';
    }
  }
</script>
</body>
</html>
