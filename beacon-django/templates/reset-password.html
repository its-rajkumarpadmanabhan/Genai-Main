<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Beacon AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{
      --ink:#20042E; --paper:#FAF5EE; --surface:#FFFFFF; --line:#E6D5C3;
      --pine:#804A8A; --pine-deep:#3A0353; --pine-soft:#F3E8F5; --brick:#C24141; --brick-soft:#FCEAEA;
      --slate:#F59E51; --slate-soft:#FFF2E5; --muted:#6C5275; --amber:#F59E51; --amber-soft:#FFF2E5;
      --amber-gold:#F8D299; --gold-deep:#D97E30;
      --radius:14px;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:linear-gradient(135deg, #FAF5EE 0%, #F5EAE0 100%);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}
    a{color:inherit;text-decoration:none;}
    button{font-family:inherit;}

    #view-auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 20%, #FAF5EE 0%, #F5EAE0 100%);}
    .auth-card{width:100%;max-width:440px;background:var(--surface);border:2px solid #E6D5C3;border-radius:20px;padding:32px;box-shadow:0 20px 60px rgba(58,3,83,0.15);}
    .auth-brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:8px;}
    .auth-brand .brand-mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg, #F59E51, #F8D299);color:#3A0353;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:800;font-size:22px;box-shadow:0 4px 12px rgba(245,158,81,0.4);}
    .auth-brand .brand-name{font-family:'Fraunces',serif;font-size:24px;font-weight:700;color:#3A0353;}
    .auth-sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 24px;}

    .field{margin-bottom:16px;}
    .field label{display:block;font-size:11px;font-weight:700;color:var(--pine-deep);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
    .field input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;font-size:13.5px;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);transition:border-color 0.15s ease;}
    .field input:focus{outline:none;border-color:var(--pine);background:#FFFFFF;}

    .btn-primary{width:100%;background:linear-gradient(135deg, #3A0353 0%, #804A8A 100%);color:#FFFFFF;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;box-shadow:0 4px 14px rgba(58,3,83,0.3);transition:transform 0.15s ease, box-shadow 0.15s ease;}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(58,3,83,0.4);}

    .form-msg{font-size:12.5px;padding:10px 14px;border-radius:10px;margin-top:14px;display:none;text-align:center;}
    .form-msg.error{background:#FEE2E2;color:#991B1B;border:1px solid #FCA5A5;}
    .form-msg.success{background:#D1FAE5;color:#065F46;border:1px solid #A7F3D0;}

    .form-sublink{text-align:center;font-size:12px;margin-top:18px;color:var(--muted);}
    .form-sublink a{color:var(--pine);font-weight:700;}
  </style>
</head>
<body>

<div id="view-auth">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-mark">B</div>
      <div class="brand-name">Beacon AI</div>
    </div>
    <div class="auth-sub">Set New Password</div>

    <form id="reset-form" novalidate>
      <div class="field">
        <label>New Password</label>
        <input id="new_password" type="password" placeholder="Enter new password" required />
      </div>

      <div class="field">
        <label>Confirm Password</label>
        <input id="confirm_password" type="password" placeholder="Confirm new password" required />
      </div>

      <div id="form-msg" class="form-msg"></div>

      <button type="submit" id="submit-btn" class="btn-primary">
        <span>Set New Password</span> <i class="fa-solid fa-key" style="margin-left:4px;"></i>
      </button>
    </form>

    <div class="form-sublink">
      <a href="/login">Back to Sign In</a>
    </div>
  </div>
</div>

<script>
  function safeDetail(detail) {
    if (!detail) return '';
    if (typeof detail === 'string') return detail;
    if (Array.isArray(detail)) {
      return detail.map(d => (typeof d === 'string' ? d : d.msg || JSON.stringify(d))).join('; ');
    }
    return detail.msg || JSON.stringify(detail);
  }

  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');

  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msgBox = document.getElementById('form-msg');
    const btn = document.getElementById('submit-btn');
    msgBox.style.display = 'none';
    msgBox.className = 'form-msg';

    const new_password = document.getElementById('new_password').value;
    const confirm_password = document.getElementById('confirm_password').value;

    if (!token) {
      msgBox.innerText = 'Invalid or missing password reset token.';
      msgBox.className = 'form-msg error';
      msgBox.style.display = 'block';
      return;
    }
    if (!new_password) {
      msgBox.innerText = 'Please enter a new password.';
      msgBox.className = 'form-msg error';
      msgBox.style.display = 'block';
      return;
    }
    if (new_password !== confirm_password) {
      msgBox.innerText = 'Passwords do not match.';
      msgBox.className = 'form-msg error';
      msgBox.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Updating Password...';

    try {
      const response = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, new_password })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(safeDetail(data.detail) || 'Failed to reset password.');

      msgBox.innerText = 'Password updated successfully! Redirecting to login...';
      msgBox.className = 'form-msg success';
      msgBox.style.display = 'block';
      btn.innerHTML = '<i class="fa-solid fa-check"></i> Updated';
      setTimeout(() => { window.location.href = '/login'; }, 1800);
    } catch (err) {
      msgBox.innerText = err.message;
      msgBox.className = 'form-msg error';
      msgBox.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = '<span>Set New Password</span> <i class="fa-solid fa-key" style="margin-left:4px;"></i>';
    }
  });
</script>
</body>
</html>
